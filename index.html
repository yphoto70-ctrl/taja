["세계문학풍","정원의 여행자","긴 여행을 마친 여인은 작은 정원을 가꾸기 시작했다.|그녀는 여러 나라에서 가져온 씨앗을 한 줄씩 나누어 심었다.|꽃이 피자 이웃들은 처음 보는 색과 향기에 놀라워했다.|여인은 식물마다 만났던 사람의 이야기를 들려주었다.|정원은 먼 세계를 가까운 대화로 바꾸는 조용한 장소가 되었다."],
["세계문학풍","서점의 마지막 손님","문을 닫으려던 서점에 비를 피하려는 손님이 들어왔다.|주인은 젖은 외투를 걸 자리를 내주고 따뜻한 차를 준비했다.|손님은 오래전 읽은 책의 제목을 기억하지 못한다고 말했다.|두 사람은 줄거리의 작은 조각들을 모아 책 한 권을 찾아냈다.|비가 그쳤을 때 손님은 잃어버린 기억까지 함께 되찾은 듯 웃었다."],
["생활 기사 형식","동네 도서관 소식","가상의 동네 도서관이 주민을 위한 독서 공간을 새롭게 꾸몄다.|새 공간에는 의자 20개와 작은 토론용 탁자 4개가 마련되었다.|운영 시간은 오전 9:00부터 오후 6:00까지로 정했다.|안내판에는 '책과 함께 쉬어 가세요!'라는 문구를 적었다.|주민들은 가까운 곳에서 읽고 이야기할 자리가 생긴 점을 반겼다."],
["환경 기사 형식","하천을 걷는 사람들","가상의 마을에서 주민들이 하천 주변을 함께 정리하는 행사를 열었다.|참가자 50명은 장갑과 봉투를 챙겨 오전 10:00에 모였다.|모은 물건은 종류에 따라 분류하고 무게를 기록했다.|행사 뒤에는 [깨끗한 물길]을 주제로 짧은 대화를 나누었다.|참가자들은 다음 달에도 같은 길을 함께 걷기로 약속했다."],
["경제 기사 형식","작은 시장의 변화","가상의 전통시장이 방문객의 길 찾기를 돕는 안내 지도를 만들었다.|지도에는 가게 30곳의 위치와 주요 판매 품목을 표시했다.|공동 안내판의 제작 예산은 500,000원으로 설정했다.|상인들은 영업 시간과 연락처를 한 번 더 확인했다.|방문객은 필요한 가게를 쉽게 찾고 상인은 서로의 일을 더 알게 되었다."],
["문화 기사 형식","주민들의 사진 전시","가상의 문화센터가 주민들이 촬영한 동네 사진을 전시했다.|참여한 주민 12명은 서로 다른 계절과 골목의 모습을 담았다.|작품마다 제목, 촬영 장소, 짧은 설명을 함께 붙였다.|전시 제목은 <우리 동네의 하루>로 정했다.|관람객들은 익숙한 거리에서도 새로운 장면을 발견할 수 있었다."],
["과학 기사 형식","학교의 관찰 수업","가상의 학교에서 학생들이 식물의 성장을 관찰하는 수업을 진행했다.|학생들은 같은 종류의 씨앗을 화분 10개에 나누어 심었다.|기록표에는 날짜, 높이(cm), 잎의 수를 적었다.|교사는 결과보다 관찰 과정과 질문을 자세히 남기도록 안내했다.|수업이 끝날 때 학생들은 작은 변화도 꾸준히 살피는 즐거움을 배웠다."],
["교육 기사 형식","질문하는 교실","가상의 교실에서 학생들이 하루에 질문 하나씩 적는 활동을 시작했다.|질문 상자에는 첫 주에 35개의 메모가 모였다.|교사는 비슷한 질문을 묶고 학생들과 함께 답을 찾아보았다.|정답을 찾기 어려운 질문에는 '더 알아보기' 표시를 남겼다.|학생들은 모른다고 말하는 일이 배움의 시작임을 경험했다."],
["생활 기사 형식","수리 모임의 하루","가상의 주민 모임이 고장 난 생활용품을 함께 살펴보는 자리를 열었다.|책상 위에는 의자 3개, 우산 5개, 작은 선풍기 2대가 놓였다.|참가자들은 먼저 상태를 확인하고 필요한 도구를 정리했다.|수리가 어려운 물건에는 [추가 점검]이라는 메모를 붙였다.|모임은 물건을 고치는 시간과 서로의 경험을 나누는 시간을 함께 만들었다."],
["지역 기사 형식","골목 안내판","가상의 마을이 골목의 주요 시설을 안내하는 표지판을 설치했다.|표지판 8개에는 도서관, 쉼터, 정류장으로 가는 방향이 담겼다.|글자 크기와 색은 멀리서도 읽기 쉽게 정했다.|주민들은 1차 점검에서 위치와 표현을 직접 확인했다.|낯선 방문객도 길을 묻고 찾는 과정에서 동네를 편하게 만날 수 있게 되었다."],
["체육 기사 형식","함께 뛰는 운동회","가상의 동네 운동회가 승부보다 참여를 중심으로 프로그램을 구성했다.|총 6개 팀이 이어달리기와 협동 공놀이에 참가했다.|진행자는 경기마다 규칙을 설명하고 준비 상태를 확인했다.|점수판 옆에는 '응원도 함께!'라는 안내를 붙였다.|마지막 순서에서는 모든 참가자가 함께 운동장을 한 바퀴 걸었다."],
["문화 기사 형식","작은 음악회","가상의 주민 음악회가 오후 4:30에 마을 회관에서 열렸다.|연주자 7명은 각자 좋아하는 곡을 한 곡씩 준비했다.|프로그램에는 곡명과 악기 이름을 함께 적었다.|마지막 곡은 관객과 연주자가 함께 부르는 짧은 노래였다.|박수 소리가 잦아든 뒤에도 사람들은 자리에 남아 음악 이야기를 나누었다."],
["자연 수필","숲의 시간","숲에 들어서면 걸음의 속도가 먼저 달라진다.|햇빛은 잎 사이를 지나 작은 점으로 땅에 내려앉는다.|나는 큰 나무만 보던 눈을 낮추어 이끼와 풀을 살펴본다.|서두르지 않아야 보이는 것들이 길가에 가득하다.|숲의 시간은 많이 움직이는 일보다 자세히 머무는 일을 가르친다."],
["자연 수필","바다의 색","바다는 한 가지 색으로 설명하기 어려운 풍경이다.|구름이 지나갈 때마다 물결 위의 빛이 조금씩 바뀐다.|가까운 파도는 밝고 먼 수평선은 깊은 빛을 띤다.|나는 같은 자리에 앉아 달라지는 색을 오래 바라본다.|늘 같은 바다라고 생각한 것은 내가 오래 보지 않았기 때문일지 모른다."],
["자연 수필","가을의 잎","낙엽 한 장을 주워 손바닥 위에 올려놓았다.|잎맥은 작은 길처럼 가지를 나누며 가장자리까지 이어졌다.|여름 내내 햇빛을 받던 잎이 이제 바닥의 흙으로 돌아간다.|끝난 것처럼 보이는 시간도 다른 시작을 준비하고 있다.|나는 잎을 다시 내려놓고 나무 아래를 천천히 지나갔다."],
["자연 수필","새벽의 소리","새벽의 집은 낮과 다른 소리를 들려준다.|냉장고의 낮은 울림과 먼 도로의 바퀴 소리가 분명해진다.|창문을 열면 이름 모를 새의 짧은 울음이 들린다.|나는 아무것도 틀지 않고 잠시 그 소리들을 듣는다.|조용함은 소리가 없는 상태보다 작은 소리를 알아보는 시간에 가깝다."],
["자연 수필","작은 화분","작은 화분 하나를 책상 가까이에 두었다.|아침마다 흙을 살피고 잎의 방향을 조금씩 바꾸어 본다.|변화가 없는 듯한 날들이 지나자 새잎이 조용히 나타났다.|나는 매일의 돌봄이 바로 보이는 결과만을 위한 일은 아니라고 생각했다.|작은 초록빛이 바쁜 하루 사이에 기다리는 마음을 남겨 주었다."],
["생활 수필","아침 한 잔","아침에 따뜻한 차를 준비하는 일은 나의 작은 습관이다.|물이 끓는 동안 창밖의 날씨를 보고 오늘의 약속을 떠올린다.|컵을 두 손으로 감싸면 아직 바쁘지 않은 시간이 느껴진다.|하루를 잘 보내겠다는 큰 다짐 대신 첫 일을 천천히 시작한다.|한 잔의 차는 특별한 계획보다 차분한 출발을 도와준다."],
["생활 수필","정리하는 오후","책상의 물건을 정리하다가 오래된 영화표를 발견했다.|버릴 물건을 고르는 시간은 기억을 다시 고르는 시간과 닮았다.|필요하지 않은 종이에도 그날의 표정이 남아 있기도 한다.|나는 영화표 한 장만 작은 상자에 넣고 나머지는 정리했다.|빈자리가 생긴 책상에는 새로운 일을 시작할 여유가 놓였다."],
["생활 수필","느린 산책","오늘은 목적지를 정하지 않고 집 밖으로 나왔다.|늘 지나던 길에서 처음 보는 간판과 창문을 발견했다.|길모퉁이의 꽃은 지난주보다 조금 더 크게 피어 있었다.|멀리 가야 새로운 것을 만나는 것은 아니라는 생각이 들었다.|집으로 돌아왔을 때 짧은 산책은 긴 여행처럼 마음에 남았다."],
["생활 수필","함께 먹는 저녁","저녁 준비를 하며 각자 맡을 일을 하나씩 골랐다.|누군가는 채소를 씻고 누군가는 그릇을 식탁에 놓았다.|음식이 완성되기 전부터 대화는 자연스럽게 이어졌다.|오늘의 작은 실수도 웃으며 이야기할 수 있었다.|좋은 식사는 맛뿐 아니라 서로의 하루를 받아 주는 시간으로 완성된다."],
["생활 수필","연습의 기록","처음 타자연습을 했을 때 나는 속도만 자주 확인했다.|빨리 입력하려다가 같은 글자를 여러 번 틀리곤 했다.|어느 날부터 틀린 부분을 천천히 고치며 손의 움직임을 살폈다.|조금씩 정확해지자 문장을 읽는 마음도 편안해졌다.|오늘의 기록은 어제와 경쟁하는 숫자보다 계속 연습했다는 표시가 되었다."],
["청소년 이야기","발표하는 날","발표 순서가 가까워지자 민지는 준비한 종이를 다시 펼쳤다.|첫 문장을 여러 번 읽었지만 목소리가 작아질까 걱정되었다.|앞자리에 앉은 친구가 눈을 맞추고 천천히 고개를 끄덕였다.|민지는 숨을 고르고 자신의 생각을 한 문장씩 전했다.|발표가 끝난 뒤 가장 먼저 떠오른 것은 실수보다 끝까지 말했다는 기쁨이었다."],
["청소년 이야기","새로운 친구","새 학기 첫날, 준호는 교실 뒤편의 빈자리에 앉았다.|쉬는 시간이 되어도 누구에게 말을 걸어야 할지 몰랐다.|옆자리 친구가 책의 표지를 보고 같은 이야기를 좋아한다고 말했다.|두 사람은 주인공의 선택을 두고 서로 다른 의견을 나누었다.|점심시간이 되었을 때 빈자리는 더 이상 낯선 자리처럼 느껴지지 않았다."],
["청소년 이야기","작은 프로젝트","세 친구는 학교 축제에서 작은 종이 정원을 만들기로 했다.|처음에는 하고 싶은 모양이 달라 의견이 쉽게 모이지 않았다.|아이들은 각자의 그림을 한 장씩 펼치고 이유를 설명했다.|서로의 좋은 생각을 모으자 처음보다 더 재미있는 설계가 나왔다.|완성된 정원에는 세 사람의 이름과 함께 '우리의 첫 작품'이라는 제목이 붙었다."],
["청소년 이야기","잃어버린 공책","도윤은 집으로 돌아가는 길에 숙제 공책이 없다는 사실을 알았다.|가방을 여러 번 살폈지만 책 사이에는 빈자리만 남아 있었다.|그는 학교로 돌아가 마지막으로 앉았던 벤치를 확인했다.|공책은 안내실에 맡겨져 있었고 표지에 짧은 메모가 붙어 있었다.|'찾게 되어 다행이야!'라는 글씨를 보고 도윤은 다음 친절을 생각했다."],
["청소년 이야기","첫 번째 도전","수아는 처음 참가한 달리기에서 가장 늦게 결승선을 통과했다.|기록을 보고 실망했지만 끝까지 기다리던 친구가 박수를 보냈다.|선생님은 출발 전의 두려움과 달리는 동안의 노력을 함께 물었다.|수아는 자신이 포기하지 않았다는 사실을 그제야 자세히 떠올렸다.|다음 연습의 목표는 다른 사람을 이기는 일보다 조금 더 편하게 달리는 일이었다."],
["상상 이야기","달의 우체국","달의 작은 우체국에는 지구에서 보낸 편지들이 조용히 쌓였다.|우체부는 별빛을 잉크 삼아 봉투에 도착 날짜를 적었다.|어느 날 주소가 '나를 기다리는 사람'으로만 적힌 편지가 왔다.|그는 가장 오래 켜져 있는 창문을 찾아 달의 마을을 돌아보았다.|편지를 받은 사람은 주소보다 마음이 먼저 길을 찾았다고 말했다."],

const VOWELS = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅗㅏ","ㅗㅐ","ㅗㅣ","ㅛ","ㅜ","ㅜㅓ","ㅜㅔ","ㅜㅣ","ㅠ","ㅡ","ㅡㅣ","ㅣ"];
const FINALS = ["","ㄱ","ㄲ","ㄱㅅ","ㄴ","ㄴㅈ","ㄴㅎ","ㄷ","ㄹ","ㄹㄱ","ㄹㅁ","ㄹㅂ","ㄹㅅ","ㄹㅌ","ㄹㅍ","ㄹㅎ","ㅁ","ㅂ","ㅂㅅ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const COMPAT_SPLITS = {"ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ","ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ","ㅘ":"ㅗㅏ","ㅙ":"ㅗㅐ","ㅚ":"ㅗㅣ","ㅝ":"ㅜㅓ","ㅞ":"ㅜㅔ","ㅟ":"ㅜㅣ","ㅢ":"ㅡㅣ"};
function typingUnits(value){
  let result="";
  for(const char of value.normalize("NFC")){
    const n=char.codePointAt(0)-0xAC00;
    if(n>=0&&n<11172){
      result+=INITIALS[Math.floor(n/588)]+VOWELS[Math.floor(n%588/28)]+FINALS[n%28];
    }else result+=COMPAT_SPLITS[char]||char;
  }
  return Array.from(result);
}
const JAMO_KEYS={"ㄱ":"R","ㄲ":"R","ㄴ":"S","ㄷ":"E","ㄸ":"E","ㄹ":"F","ㅁ":"A","ㅂ":"Q","ㅃ":"Q","ㅅ":"T","ㅆ":"T","ㅇ":"D","ㅈ":"W","ㅉ":"W","ㅊ":"C","ㅋ":"Z","ㅌ":"X","ㅍ":"V","ㅎ":"G","ㅏ":"K","ㅐ":"O","ㅑ":"I","ㅒ":"O","ㅓ":"J","ㅔ":"P","ㅕ":"U","ㅖ":"P","ㅗ":"H","ㅛ":"Y","ㅜ":"N","ㅠ":"B","ㅡ":"M","ㅣ":"L"};
const PUNCT_KEYS={" ":["Space",false],"`": ["Backquote",false],"~":["Backquote",true],"-":["Minus",false],"_":["Minus",true],"=":["Equal",false],"+":["Equal",true],"[": ["BracketLeft",false],"{": ["BracketLeft",true],"]": ["BracketRight",false],"}":["BracketRight",true],"\\":["Backslash",false],"|":["Backslash",true],";":["Semicolon",false],":":["Semicolon",true],"'": ["Quote",false],'"':["Quote",true],",":["Comma",false],"<":["Comma",true],".":["Period",false],">":["Period",true],"/":["Slash",false],"?":["Slash",true]};
"!@#$%^&*()".split("").forEach((c,i)=>{PUNCT_KEYS[c]=["Digit"+"1234567890"[i],true]});
function hintForUnit(char){
  if(JAMO_KEYS[char])return{code:"Key"+JAMO_KEYS[char],shift:"ㄲㄸㅃㅆㅉㅒㅖ".includes(char),label:char+" ("+JAMO_KEYS[char]+" 키)"};
  if(/^[a-zA-Z]$/.test(char))return{code:"Key"+char.toUpperCase(),shift:char===char.toUpperCase(),label:char};
  if(/^[0-9]$/.test(char))return{code:"Digit"+char,shift:false,label:char};
  if(PUNCT_KEYS[char])return{code:PUNCT_KEYS[char][0],shift:PUNCT_KEYS[char][1],label:char===" "?"띄어쓰기 (Space)":char};
  return null;
}
function markHint(code,kind){(keysByCode.get(code)||[]).forEach(node=>node.classList.add(kind))}
function updateNextKeyHint(){
  svg.querySelectorAll(".key-next").forEach(n=>n.classList.remove("key-next"));
  svg.querySelectorAll(".key-shift-needed").forEach(n=>n.classList.remove("key-shift-needed"));
  const hint=$("nextKeyHint");hint.textContent="";
  if(mode!=="word"||item===null)return;
  const expected=typingUnits(getExpected()),entered=typingUnits(input.value);
  let position=0;
  while(position<entered.length&&position<expected.length&&entered[position]===expected[position])position++;
  if(position<entered.length){
    markHint("Backspace","key-next");hint.textContent="입력이 달라요. 틀린 부분을 지우거나 고쳐 주세요. (Backspace)";return;
  }
  if(position===expected.length){
    if(composing){markHint("Enter","key-next");hint.textContent="마지막 글자까지 맞았어요. Enter로 한글 입력을 확정하세요."}
    else hint.textContent="정답입니다! 다음 단어를 준비합니다.";
    return;
  }
  const next=hintForUnit(expected[position]);
  if(!next){hint.textContent="다음 글자: "+expected[position];return}
  markHint(next.code,"key-next");
  if(next.shift)markHint("ShiftLeft","key-shift-needed");
  hint.textContent="다음 입력: "+(next.shift?"Shift + ":"")+next.label;
}
setInterval(updateStats,1000);start("word");
</script>
